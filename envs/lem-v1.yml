# lem-v1: Linux rebuild of the v1 (macOS) environment in environment.yml, used only to
# separate environment drift from refactor bugs (Phase 0 step 5, Phase 2).
#
# Kept at the v1 versions: python, numpy, scipy, numba/llvmlite, scikit-learn,
# statsmodels, pandas, matplotlib (the packages that touch numerics).
# Dropped: macOS-only packages (appnope, libcxx, llvm-openmp), Jupyter stack,
# Qt, cartopy/plotly/geopandas (not imported by src/ or tests/).
# GDAL/rasterio are I/O only (GeoTIFF float64 read/write is exact), so they are
# allowed to float to whatever conda-forge can solve with the pins above; the
# resolved versions are recorded in reference/logs/lem-v1_packages.txt.
name: lem-v1
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10.12
  - numpy=1.26.4
  - scipy=1.15.3
  - pandas=2.1.1
  - matplotlib-base=3.6.2
  - scikit-learn=1.3.2
  - statsmodels=0.14.0
  - numba=0.61.2
  - llvmlite=0.44.0
  - scikit-image=0.25.2
  - gdal>=3.6
  - rasterio>=1.4
  - richdem
  - pytest
  - pip
