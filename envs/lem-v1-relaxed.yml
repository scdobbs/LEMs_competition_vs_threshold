# Fallback for envs/lem-v1.yml if the strict solve fails: only the numerically
# relevant pins are kept (python 3.10, numpy 1.26.4, scipy 1.15.3); everything
# else floats.
name: lem-v1
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10.*
  - numpy=1.26.4
  - pandas
  - matplotlib-base
  - gdal>=3.6
  - rasterio>=1.4
  - richdem
  - pytest
  - pip
  - pip:
      - scipy==1.15.3
      - statsmodels
