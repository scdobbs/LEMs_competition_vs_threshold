# Where the grids live. LEMCVT_DATA points at a directory with the layout
#   <site>/tile<n>/<name>.tif and <site>/tile<n>/outputs/<name>.tif
# `lemcvt data fetch` copies from `source` (group storage on Sherlock) into LEMCVT_DATA
# and verifies sha256 against data/manifest.csv.
# `versions` (addendum 15, tile expansion stage B): tile sets cut from the re-routed 1 m full grids; files live under
# $LEMCVT_DATA/<dir>/<tile>/ and are listed in data/manifest.csv (site column = the version name). Data stay outside git.
source: $GROUP_HOME/lemcvt_data/v1
versions:
  GM-x:
    dir: GM-x
    site: GM
    crs_epsg: 32610
    cell_m: 1.0
    tiles:
    - GM1
    - GM2
    - GM3
    - GM4
    - GM5
    - GM6
    - GM7
    n_tiles: 7
    source: Gabilan_mesa.tif routed as one full grid (addendum 15 section 3)
    run: 20261118T160326Z_a15_stage_b
    products:
    - filled (m, float32)
    - fd (uint8 lemcvt codes)
    - area (m^2, float64)
    - gapfill_mask
    - 'area_model (m^2, float64; GM1-GM5 only: the old tile area grids, addendum 17 decision 2)'
    - 'area_model_rule (m^2, float64; GM1-GM5 only: the addendum 16 section 4 rule grids, unused)'
    draw: addendum 15 section 5 (seed 20261118); originals re-cut (GM) or cut from 3DEP (AP<n>_3dep)
    area_model:
      GM1: old tile area grid GM/tile<n>/GM_1m_best_tile_area.tif (addendum 17 decision 2)
      GM2: old tile area grid GM/tile<n>/GM_1m_best_tile_area.tif (addendum 17 decision 2)
      GM3: old tile area grid GM/tile<n>/GM_1m_best_tile_area.tif (addendum 17 decision 2)
      GM4: old tile area grid GM/tile<n>/GM_1m_best_tile_area.tif (addendum 17 decision 2)
      GM5: old tile area grid GM/tile<n>/GM_1m_best_tile_area.tif (addendum 17 decision 2)
    area_model_rule:
      GM1: new area + strip inflow at the entry cells (addendum 16 check failed); unused
      GM2: new area + strip inflow at the entry cells (addendum 16 check failed); unused
      GM3: old tile area grid (addendum 16 check passed)
      GM4: new area + strip inflow at the entry cells (addendum 16 check failed); unused
      GM5: new area + strip inflow at the entry cells (addendum 16 check failed); unused
  AP-3DEP-x:
    dir: AP-3DEP-x
    site: AP
    crs_epsg: 6346
    cell_m: 1.0
